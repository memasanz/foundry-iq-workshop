<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1590" viewBox="0 0 1800 1590" role="img" aria-labelledby="title description"><title id="title">Lab 12 APIM architecture and identities</title><desc id="description">Notebook sends broker token to APIM. APIM performs on-behalf-of exchange, adds Web IQ authentication and uses its own identity for Search access while preserving the signed-in user for SharePoint ACL checks. Broker and SharePoint ingestion app registrations have separate roles.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#495057"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="40" y="50.0" font-size="30" font-family="Arial, sans-serif" fill="#000000">Lab 12: APIM brokers the request, not the user&#x27;s document permissions</text><text x="40" y="106.0" font-size="21" font-family="Arial, sans-serif" fill="#000000">Three different tokens: T1 = caller -&gt; broker API; T2 = same user -&gt; Search (OBO); T3 = APIM identity -&gt; Search.</text><text x="40" y="137.5" font-size="21" font-family="Arial, sans-serif" fill="#000000">Runtime retrieval flow below. Source lookup / knowledge-base creation still go directly from notebook to Search.</text><rect x="40" y="215" width="310" height="340" rx="12" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/><text x="60" y="254.0" font-size="19" font-family="Arial, sans-serif" fill="#000000">Python notebook / Azure CLI</text><text x="60" y="282.5" font-size="19" font-family="Arial, sans-serif" fill="#000000"></text><text x="60" y="311.0" font-size="19" font-family="Arial, sans-serif" fill="#000000">Signed-in workshop user</text><text x="60" y="339.5" font-size="19" font-family="Arial, sans-serif" fill="#000000">Requests broker API token</text><text x="60" y="368.0" font-size="19" font-family="Arial, sans-serif" fill="#000000">Uses broker client ID</text><text x="60" y="396.5" font-size="19" font-family="Arial, sans-serif" fill="#000000">No broker secret or Web IQ</text><text x="60" y="425.0" font-size="19" font-family="Arial, sans-serif" fill="#000000">key in retrieval requests</text><rect x="580" y="215" width="480" height="340" rx="12" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/><text x="600" y="254.0" font-size="19" font-family="Arial, sans-serif" fill="#000000">Existing APIM gateway: /iq</text><text x="600" y="282.5" font-size="19" font-family="Arial, sans-serif" fill="#000000"></text><text x="600" y="311.0" font-size="19" font-family="Arial, sans-serif" fill="#000000">Validate T1: tenant, audience, scope</text><text x="600" y="339.5" font-size="19" font-family="Arial, sans-serif" fill="#000000">Exchange T1 for T2 using broker app</text><text x="600" y="368.0" font-size="19" font-family="Arial, sans-serif" fill="#000000">Add Web IQ key from secret named value</text><text x="600" y="396.5" font-size="19" font-family="Arial, sans-serif" fill="#000000">Replace Authorization with T3</text><text x="600" y="425.0" font-size="19" font-family="Arial, sans-serif" fill="#000000">Strip elevated-read bypass header</text><rect x="1380" y="215" width="380" height="340" rx="12" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/><text x="1400" y="254.0" font-size="19" font-family="Arial, sans-serif" fill="#000000">Azure AI Search</text><text x="1400" y="282.5" font-size="19" font-family="Arial, sans-serif" fill="#000000"></text><text x="1400" y="311.0" font-size="19" font-family="Arial, sans-serif" fill="#000000">&lt;prefix&gt;-apim-kb</text><text x="1400" y="339.5" font-size="19" font-family="Arial, sans-serif" fill="#000000">T3: authorize gateway</text><text x="1400" y="368.0" font-size="19" font-family="Arial, sans-serif" fill="#000000">T2: preserve user&#x27;s context</text><text x="1400" y="396.5" font-size="19" font-family="Arial, sans-serif" fill="#000000">for indexed SharePoint ACLs</text><text x="1400" y="425.0" font-size="19" font-family="Arial, sans-serif" fill="#000000">Key controls for Web IQ only</text><polyline points="350,390 580,390" fill="none" stroke="#0078D4" stroke-width="3" marker-end="url(#arrow)"/><text x="365" y="303.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">2. Send T1</text><text x="365" y="330.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">Authorization:</text><text x="365" y="357.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">Bearer broker token</text><polyline points="1060,390 1380,390" fill="none" stroke="#5C2D91" stroke-width="3" marker-end="url(#arrow)"/><text x="1075" y="278.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">4. Authorization = T3</text><text x="1075" y="305.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">User-context header = T2</text><text x="1075" y="332.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">Web IQ per-source key headers</text><rect x="580" y="775" width="480" height="260" rx="12" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/><text x="600" y="814.0" font-size="19" font-family="Arial, sans-serif" fill="#000000">Microsoft Entra ID</text><text x="600" y="842.5" font-size="19" font-family="Arial, sans-serif" fill="#000000"></text><text x="600" y="871.0" font-size="19" font-family="Arial, sans-serif" fill="#000000">Issues T1 to Azure CLI for broker API</text><text x="600" y="899.5" font-size="19" font-family="Arial, sans-serif" fill="#000000">OBO: T1 + broker ID + broker secret</text><text x="600" y="928.0" font-size="19" font-family="Arial, sans-serif" fill="#000000">   -&gt; T2 for Search, same user</text><text x="600" y="956.5" font-size="19" font-family="Arial, sans-serif" fill="#000000">APIM managed identity obtains T3</text><polyline points="195,555 195,905 580,905" fill="none" stroke="#0078D4" stroke-width="3" marker-end="url(#arrow)"/><text x="220" y="798.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">1. Sign in; acquire T1</text><text x="220" y="825.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">api://&lt;broker-id&gt;/.default</text><text x="220" y="852.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">Exposed user_impersonation scope</text><polyline points="800,555 800,775" fill="none" stroke="#5C2D91" stroke-width="3" marker-end="url(#arrow)"/><text x="825" y="618.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">3. OBO exchange</text><text x="825" y="645.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">Broker authenticates</text><text x="825" y="672.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">with its APIM-held secret</text><rect x="1380" y="775" width="380" height="260" rx="12" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/><text x="1400" y="813.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">5. Retrieve + synthesize</text><text x="1400" y="840.0" font-size="18" font-family="Arial, sans-serif" fill="#000000"></text><text x="1400" y="867.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">Existing CU Blob index (05)</text><text x="1400" y="894.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">Existing SharePoint ACL index (07)</text><text x="1400" y="921.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">Web IQ MCP: public web</text><text x="1400" y="948.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">Foundry models via Search identity</text><polyline points="1730,555 1730,775" fill="none" stroke="#107C10" stroke-width="3" marker-end="url(#arrow)"/><text x="1395" y="628.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">No new ingestion in lab 12</text><text x="1395" y="655.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">No live SharePoint site call</text><text x="1395" y="682.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">for the indexed source</text><text x="40" y="1106.0" font-size="21" font-family="Arial, sans-serif" fill="#000000">Answer + references return through APIM to the notebook. The stored Web IQ key is not a user&#x27;s document credential.</text><text x="40" y="1137.5" font-size="21" font-family="Arial, sans-serif" fill="#000000">Retrieval needs a broker token; direct source/KB setup still needs the user&#x27;s Search RBAC. Shared services are not per-user isolation.</text><text x="40" y="1217.0" font-size="27" font-family="Arial, sans-serif" fill="#000000">Which identity / app registration does what?</text><rect x="40" y="1255" width="550" height="300" rx="12" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/><text x="60" y="1293.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">Broker app registration (lab 12)</text><text x="60" y="1320.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">Expose user_impersonation to Azure CLI</text><text x="60" y="1347.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">Request delegated Search permission</text><text x="60" y="1374.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">Admin consent enables downstream OBO</text><text x="60" y="1401.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">APIM stores broker-client-secret</text><text x="60" y="1428.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">NOT the SharePoint ingestion app</text><rect x="625" y="1255" width="550" height="300" rx="12" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/><text x="645" y="1293.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">APIM system-assigned identity</text><text x="645" y="1320.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">Gets T3 without a broker client secret</text><text x="645" y="1347.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">Needs Search Index Data Reader</text><text x="645" y="1374.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">at the Search service scope</text><text x="645" y="1401.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">This does not replace T2 user context</text><text x="645" y="1428.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">or grant the user SharePoint access</text><rect x="1210" y="1255" width="550" height="300" rx="12" fill="#F3F2F1" stroke="#495057" stroke-width="2"/><text x="1230" y="1293.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">SharePoint ingestion app (lab 07)</text><text x="1230" y="1320.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">Trusts Search managed identity (federation)</text><text x="1230" y="1347.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">Approved app permissions + site grant</text><text x="1230" y="1374.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">Populate the indexed content / ACLs</text><text x="1230" y="1401.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">No ingestion-app secret for this path</text><text x="1230" y="1428.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">NOT used for APIM&#x27;s runtime OBO</text></svg>