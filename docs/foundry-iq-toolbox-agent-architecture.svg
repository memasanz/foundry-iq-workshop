<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1610" viewBox="0 0 1800 1610" role="img" aria-labelledby="title description"><title id="title">Lab 14 hosted agent and Foundry toolbox architecture</title><desc id="description">User invokes a hosted agent, which uses FoundryToolbox to reach a Blob-only Search knowledge base through an AgenticIdentityToken project connection. The deployed agent principal needs its own Search Index Data Reader role. The agent model and knowledge-base models are separate inference layers.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#495057"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="40" y="50.0" font-size="30" font-family="Arial, sans-serif" fill="#000000">Lab 14: a hosted agent retrieves Blob knowledge through a Foundry toolbox</text><text x="40" y="106.0" font-size="21" font-family="Arial, sans-serif" fill="#000000">The user invokes the agent. The toolbox calls Search using the agent&#x27;s own identity, not the user&#x27;s or project&#x27;s.</text><text x="40" y="137.5" font-size="21" font-family="Arial, sans-serif" fill="#000000">This lab is Blob-only: no APIM broker, Web IQ key or per-user SharePoint on-behalf-of exchange.</text><rect x="40" y="215" width="310" height="340" rx="12" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/><text x="60" y="254.0" font-size="19" font-family="Arial, sans-serif" fill="#000000">Notebook user</text><text x="60" y="282.5" font-size="19" font-family="Arial, sans-serif" fill="#000000"></text><text x="60" y="311.0" font-size="19" font-family="Arial, sans-serif" fill="#000000">Azure CLI sign-in</text><text x="60" y="339.5" font-size="19" font-family="Arial, sans-serif" fill="#000000">Responses API invocation</text><text x="60" y="368.0" font-size="19" font-family="Arial, sans-serif" fill="#000000">Receives agent answer</text><text x="60" y="396.5" font-size="19" font-family="Arial, sans-serif" fill="#000000">and tool-call output</text><rect x="580" y="215" width="440" height="340" rx="12" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/><text x="600" y="254.0" font-size="19" font-family="Arial, sans-serif" fill="#000000">Hosted agent in Foundry</text><text x="600" y="282.5" font-size="19" font-family="Arial, sans-serif" fill="#000000"></text><text x="600" y="311.0" font-size="19" font-family="Arial, sans-serif" fill="#000000">&lt;prefix&gt;-iq-agent</text><text x="600" y="339.5" font-size="19" font-family="Arial, sans-serif" fill="#000000">main.py / ResponsesHostServer</text><text x="600" y="368.0" font-size="19" font-family="Arial, sans-serif" fill="#000000">Agent + FoundryChatClient</text><text x="600" y="396.5" font-size="19" font-family="Arial, sans-serif" fill="#000000">FoundryToolbox(credential)</text><text x="600" y="425.0" font-size="19" font-family="Arial, sans-serif" fill="#000000">TOOLBOX_NAME selects the toolbox</text><rect x="1330" y="215" width="430" height="340" rx="12" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/><text x="1350" y="254.0" font-size="19" font-family="Arial, sans-serif" fill="#000000">Foundry toolbox</text><text x="1350" y="282.5" font-size="19" font-family="Arial, sans-serif" fill="#000000"></text><text x="1350" y="311.0" font-size="19" font-family="Arial, sans-serif" fill="#000000">&lt;prefix&gt;-iq-toolbox</text><text x="1350" y="339.5" font-size="19" font-family="Arial, sans-serif" fill="#000000">Stable endpoint, default version</text><text x="1350" y="368.0" font-size="19" font-family="Arial, sans-serif" fill="#000000">MCP tool: knowledge_base_retrieve</text><text x="1350" y="396.5" font-size="19" font-family="Arial, sans-serif" fill="#000000">require_approval = never</text><text x="1350" y="425.0" font-size="19" font-family="Arial, sans-serif" fill="#000000">Connection controls authentication</text><polyline points="350,390 580,390" fill="none" stroke="#0078D4" stroke-width="3" marker-end="url(#arrow)"/><text x="365" y="318.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">1. responses.create</text><text x="365" y="345.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">Signed-in caller</text><polyline points="1020,390 1330,390" fill="none" stroke="#5C2D91" stroke-width="3" marker-end="url(#arrow)"/><text x="1040" y="298.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">2. Discover + call tool</text><text x="1040" y="325.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">Agent chooses when to retrieve</text><text x="1040" y="352.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">No Search URL/key in main.py</text><rect x="40" y="765" width="310" height="280" rx="12" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/><text x="60" y="803.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">Existing indexed Blob content</text><text x="60" y="830.0" font-size="18" font-family="Arial, sans-serif" fill="#000000"></text><text x="60" y="857.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">Lab 05: &lt;prefix&gt;-cu-chunks</text><text x="60" y="884.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">Lab 11: &lt;prefix&gt;-kb-blob</text><text x="60" y="911.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">Text + PDF source metadata</text><text x="60" y="938.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">No new upload or indexing</text><rect x="580" y="765" width="440" height="280" rx="12" fill="#F3F2F1" stroke="#495057" stroke-width="2"/><text x="600" y="804.0" font-size="19" font-family="Arial, sans-serif" fill="#000000">Foundry models: two layers</text><text x="600" y="832.5" font-size="19" font-family="Arial, sans-serif" fill="#000000"></text><text x="600" y="861.0" font-size="19" font-family="Arial, sans-serif" fill="#000000">Agent model: decides tool use</text><text x="600" y="889.5" font-size="19" font-family="Arial, sans-serif" fill="#000000">and produces final response</text><text x="600" y="918.0" font-size="19" font-family="Arial, sans-serif" fill="#000000">KB models: planning + synthesis</text><text x="600" y="946.5" font-size="19" font-family="Arial, sans-serif" fill="#000000">Search uses its own model identity</text><rect x="1330" y="765" width="430" height="280" rx="12" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/><text x="1350" y="804.0" font-size="19" font-family="Arial, sans-serif" fill="#000000">Azure AI Search knowledge base</text><text x="1350" y="832.5" font-size="19" font-family="Arial, sans-serif" fill="#000000"></text><text x="1350" y="861.0" font-size="19" font-family="Arial, sans-serif" fill="#000000">&lt;prefix&gt;-toolbox-kb /mcp</text><text x="1350" y="889.5" font-size="19" font-family="Arial, sans-serif" fill="#000000">Agent token: Search audience</text><text x="1350" y="918.0" font-size="19" font-family="Arial, sans-serif" fill="#000000">Agent needs Search data-read role</text><text x="1350" y="946.5" font-size="19" font-family="Arial, sans-serif" fill="#000000">Only source: &lt;prefix&gt;-kb-blob</text><polyline points="800,555 800,765" fill="none" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/><text x="820" y="623.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">Agent chat model calls</text><text x="820" y="650.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">FoundryChatClient</text><polyline points="1730,555 1730,765" fill="none" stroke="#5C2D91" stroke-width="3" marker-end="url(#arrow)"/><text x="1190" y="608.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">3. Connection: &lt;prefix&gt;-iq-search-mcp</text><text x="1190" y="635.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">authType = AgenticIdentityToken</text><text x="1190" y="662.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">audience = https://search.azure.com</text><text x="1190" y="689.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">Calls Search as THIS agent</text><polyline points="1330,905 1020,905" fill="none" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/><text x="1050" y="818.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">KB planning / synthesis</text><text x="1050" y="845.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">Search identity -&gt; models</text><polyline points="1530,1045 1530,1170 195,1170 195,1045" fill="none" stroke="#107C10" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="1105.0" font-size="20" font-family="Arial, sans-serif" fill="#000000">4. Retrieve existing chunks; return evidence through Search -&gt; toolbox -&gt; agent</text><text x="480" y="1135.0" font-size="20" font-family="Arial, sans-serif" fill="#000000">The agent generates its final answer from the tool result. Inspect tool calls and citations.</text><text x="40" y="1267.0" font-size="27" font-family="Arial, sans-serif" fill="#000000">Setup permissions and runtime identities are not interchangeable</text><rect x="40" y="1310" width="550" height="270" rx="12" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/><text x="60" y="1348.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">Your user: prepares the resources</text><text x="60" y="1375.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">Create KB, project connection and toolbox</text><text x="60" y="1402.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">Write/zip Python files; remote-build agent</text><text x="60" y="1429.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">Foundry authoring + Search authoring/read</text><text x="60" y="1456.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">Role-assignment rights only for grant step</text><rect x="625" y="1310" width="550" height="270" rx="12" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/><text x="645" y="1348.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">Agent principal: runtime Search caller</text><text x="645" y="1375.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">Exists after hosted deployment</text><text x="645" y="1402.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">Grant Search Index Data Reader on Search</text><text x="645" y="1429.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">Use version.instance_identity.principal_id</text><text x="645" y="1456.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">User/project Search grants do not replace it</text><rect x="1210" y="1310" width="550" height="270" rx="12" fill="#F3F2F1" stroke="#495057" stroke-width="2"/><text x="1230" y="1348.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">Connection + toolbox: configure the tool</text><text x="1230" y="1375.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">Connection stores target + auth settings</text><text x="1230" y="1402.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">No new broker app or client secret here</text><text x="1230" y="1429.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">Promote new toolbox default without</text><text x="1230" y="1456.0" font-size="18" font-family="Arial, sans-serif" fill="#000000">redeploying the agent; verify compatibility</text></svg>